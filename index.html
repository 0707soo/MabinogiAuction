<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MabinogiAuction</title>
    <meta name="description" content="마비노기 경매장 키워드 검색기" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-topline">
          <p class="eyebrow">MabinogiAuction</p>
          <span class="hero-chip">LIVE</span>
        </div>
        <h1>경매장 검색기</h1>
      </header>

      <section class="search-card">
        <form id="search-form" class="search-form">
          <label class="search-label" for="keyword">검색어</label>
          <div class="search-row">
            <input id="keyword" name="keyword" type="text" placeholder="예: 롱소드" autocomplete="off" />
            <button type="submit">검색</button>
          </div>
        </form>
        <p id="status" class="status">검색어를 입력해 주세요.</p>
        <div class="favorites-panel">
          <div class="favorites-head">
            <span class="favorites-label">즐겨찾기 검색어</span>
            <button id="favorite-add" class="favorite-add" type="button">현재 검색어 저장</button>
          </div>
          <div id="favorite-list" class="favorite-list"></div>
        </div>
        <div class="favorites-panel recent-panel">
          <div class="favorites-head">
            <span class="favorites-label">최근 검색</span>
          </div>
          <div id="recent-list" class="favorite-list"></div>
        </div>
      </section>

      <section class="results-card">
        <div class="results-head">
          <h2>검색 결과</h2>
          <div class="results-tools">
            <label class="sort-label" for="sort-select">정렬</label>
            <select id="sort-select" class="sort-select">
              <option value="registered" selected>등록순</option>
              <option value="priceAsc">최저가순</option>
              <option value="expireAsc">만료 임박순</option>
              <option value="priceDesc">최고가순</option>
            </select>
            <div class="price-range">
              <input id="price-min" class="price-input" type="number" inputmode="numeric" placeholder="최저가" />
              <span class="price-sep">~</span>
              <input id="price-max" class="price-input" type="number" inputmode="numeric" placeholder="최고가" />
            </div>
            <span id="result-count" class="result-count">0건</span>
          </div>
        </div>
        <div class="category-filter-wrap">
          <span class="category-filter-label">분류</span>
          <div id="category-filter-list" class="category-filter-list"></div>
        </div>
        <div class="results-table-head" aria-hidden="true">
          <span>아이템</span>
          <span>분류</span>
          <span class="col-qty">수량</span>
          <span>만료</span>
          <span class="col-price">가격</span>
        </div>
        <ul id="results" class="results"></ul>
      </section>

      <footer class="footer">
        <p>Data based on NEXON Open API</p>
      </footer>
    </main>

    <div id="item-modal" class="modal hidden" aria-hidden="true">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <div>
            <p id="modal-category" class="modal-category">-</p>
            <h3 id="modal-title" class="modal-title">-</h3>
          </div>
          <button id="modal-close" class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-summary">
          <span id="modal-price">-</span>
          <span id="modal-count">-</span>
          <span id="modal-expire">-</span>
        </div>
        <section class="modal-section">
          <h4>색상</h4>
          <div id="modal-colors" class="color-list empty-state">색상 정보가 없습니다.</div>
        </section>
        <section class="modal-section">
          <h4>능력치 및 옵션</h4>
          <ul id="modal-options" class="option-list">
            <li class="empty-state">옵션 정보가 없습니다.</li>
          </ul>
        </section>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
